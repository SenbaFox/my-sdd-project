<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Breakout - my-sdd-project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div id="score">Score: 0</div>
        <div id="level">Level: 1</div>
        <div id="lives">Lives: 3</div>
      </header>
      <main>
        <canvas
          id="game-canvas"
          width="800"
          height="600"
          aria-label="Breakout game canvas"
          autofocus
          tabindex="0"
        ></canvas>
      </main>
      <div id="overlay" class="overlay hidden">
        <div id="game-end-content" class="game-end-content">
          <h1 id="end-title"></h1>
          <div id="end-stats" class="end-stats"></div>
          <button id="restart-button" class="restart-button">Restart Game</button>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
